# Purdex's wwd task manifest (docs/specs/2026-10-18-wwd-spec.md §6).
# The test tiers of CLAUDE.md written as tasks: development, merge, release.

[entry]
mode = "rewrite"

# ---- development: only what was changed; single-file runs stay on the local fast lane ----

[tasks.spa-file]
run     = "pnpm vitest run --reporter=json --outputFile={report} {files}"
cwd     = "spa"
args    = "files"
local   = true
summary = "vitest-json"

[tasks.go-pkg]
run     = "go test -json {packages}"
args    = "packages"
local   = true
summary = "go-json"

# ---- merge: affected tests, lint, guards ----
# Every task that can leave the local machine carries os:darwin (a Linux host with its worker on would otherwise claim it and fail it for
# what it lacks); a task may drop it only when it is qualified on that host (`qualify`), see internal/wwd/manifest/purdex_manifest_test.go.
# A task that runs go carries tool:go<go.mod's major.minor>, one that runs pnpm carries tool:node<N> and tool:pnpm<N>: a host whose worker has
# no such tool never gets the job (#3546). Raising Go: see docs/wwd-deploy.md.

[tasks.spa-related]
run       = "pnpm vitest related --run --reporter=json --outputFile={report} {files}"
cwd       = "spa"
args      = "files"
class     = "merge"
labels    = ["repo:purdex", "task:purdex/spa-related", "tool:node24", "tool:pnpm10"]
deps      = ["pnpm-lock.yaml"]
cacheable = true
timeout   = "30m"
summary   = "vitest-json"
qualify   = { args = ["src/lib/crypto-hash.test.ts"], reference = "air26" }

[tasks.go-changed]
run       = "go test -json {packages}"
args      = "packages"
class     = "merge"
labels    = ["os:darwin", "repo:purdex", "tool:go1.26"]
deps      = ["go.sum"]
cacheable = true
timeout   = "30m"
summary   = "go-json"

# For a change to a lock or a goroutine: the race detector on the changed packages only.
[tasks.go-race]
run       = "go test -race -json {packages}"
args      = "packages"
class     = "merge"
labels    = ["os:darwin", "repo:purdex", "tool:go1.26"]
deps      = ["go.sum"]
cacheable = true
timeout   = "30m"
summary   = "go-json"

# The mod's own tests (hooks/*.test.ts), which `go test` does not run. The whole mod directory: they are few and fast.
# Needs the claude CLI on the host (tool:claude): a host without it must not take the job (#3908). It runs with an empty HOME, no login and no network.
[tasks.mod-hooks]
run       = "claude plugin test cmd/pdx/plugin/purdex"
args      = "none"
class     = "merge"
labels    = ["os:darwin", "repo:purdex", "tool:claude"]
cacheable = true
timeout   = "10m"

# A change to a mod (hooks/*.js) runs all of cmd/pdx, plugin and daemonclient included: the plugin tests alone once let a red
# sub-package through to the release.
[tasks.mod-changed]
run       = "go test -json ./cmd/pdx/..."
args      = "none"
class     = "merge"
labels    = ["os:darwin", "repo:purdex", "tool:go1.26"]
deps      = ["go.sum"]
cacheable = true
timeout   = "30m"
summary   = "go-json"

[tasks.tsc]
run       = "pnpm tsc -b"
cwd       = "spa"
args      = "none"
class     = "merge"
labels    = ["repo:purdex", "task:purdex/tsc", "tool:node24", "tool:pnpm10"]
deps      = ["pnpm-lock.yaml"]
cacheable = true
timeout   = "30m"
qualify   = { args = [], reference = "air26" }

[tasks.lint]
run       = "make lint"
args      = "none"
class     = "merge"
labels     = ["os:darwin", "tool:go1.26"]
deps      = ["go.sum"]
cacheable = true
timeout   = "20m"

# Runs on its own, never with -run: the guard test scans every package.
[tasks.execstat-guard]
run       = "go test -json ./internal/execstat/"
args      = "none"
class     = "merge"
labels     = ["os:darwin", "tool:go1.26"]
deps      = ["go.sum"]
cacheable = true
timeout   = "10m"
summary   = "go-json"

# ---- release: the whole suite, once per version ----

[tasks.go-all]
run           = "go test -json -p 3 -timeout 30m ./..."
args          = "none"
class         = "release"
labels         = ["os:darwin", "tool:go1.26"]
deps      = ["go.sum"]
cacheable     = true
interruptible = false
timeout       = "60m"
summary       = "go-json"

[tasks.spa-full]
run           = "pnpm vitest run --maxWorkers=3 --reporter=json --outputFile={report}"
cwd           = "spa"
args          = "none"
class         = "release"
labels         = ["os:darwin", "tool:node24", "tool:pnpm10"]
deps          = ["pnpm-lock.yaml"]
cacheable     = true
timeout       = "60m"
summary       = "vitest-json"

[tasks.tsc-force]
run       = "pnpm tsc -b --force"
cwd       = "spa"
args      = "none"
class     = "release"
labels     = ["os:darwin", "tool:node24", "tool:pnpm10"]
deps      = ["pnpm-lock.yaml"]
cacheable = true
timeout   = "30m"

# The wwd end-to-end tests start daemons: never answered from a stored result, never queued onto a host that has no Mac's Go.
[tasks.e2e]
run       = "go test -json -tags e2e -run TestE2E -count=1 -timeout 20m ./cmd/wwd/"
args      = "none"
class     = "release"
labels    = ["os:darwin", "tool:go1.26"]
deps      = ["go.sum"]
cacheable = false
timeout   = "30m"
summary   = "go-json"

# wwd also runs on mserv (Linux). The packages that build and pass there, one by one (the others need a Mac); the tree is the cwd, so the tests
# that read the repo's own files run too. Only a host with os:linux takes these (mserv's worker takes a job only when its labels name its os:).
[tasks.wwd-linux]
run       = "go test -json ./internal/wwd/facts/ ./internal/wwd/derived/ ./internal/wwd/labels/ ./internal/wwd/clones/ ./internal/wwd/run/ ./internal/wwd/jobdb/ ./internal/wwd/store/ ./internal/wwd/queue/ ./internal/wwd/snapshot/ ./internal/wwd/worker/quarantine/ ./internal/wwd/worker/jobexec/ ./internal/wwd/worker/runner/ ./internal/wwd/worker/loop/ ./internal/wwd/worker/report/ ./internal/wwd/worker/pick/ ./internal/wwd/daemon/ ./internal/hostmem/ ./internal/wwd/orphans/ ./internal/wwd/deps/ ./internal/wwd/install/ ./internal/wwd/slicecfg/ ./internal/wwd/qualify/ ./internal/wwd/manifest/ ./internal/wwd/wire/ ./internal/wwd/client/ ./internal/wwd/jobscmd/ ./internal/wwd/manifestref/ ./internal/wwd/advisor/"
args      = "none"
class     = "release"
labels    = ["os:linux", "repo:purdex", "tool:go1.26"]
deps      = ["go.sum"]
cacheable = true
timeout   = "30m"
summary   = "go-json"

# The build-tagged tests of mserv (sandbox, deps, the per-job database) need sudo and a real MySQL: vet only, as the release gate always did.
[tasks.wwd-linux-vet]
run       = "go vet -tags mserv,e2e ./internal/wwd/run/ ./internal/wwd/worker/jobexec/ ./cmd/wwd/"
args      = "none"
class     = "release"
labels    = ["os:linux", "repo:purdex", "tool:go1.26"]
deps      = ["go.sum"]
cacheable = true
timeout   = "30m"

# The tests of the scripts, one job each (a `run` has no shell, so they cannot be one task). They start processes: never from a stored result.
[tasks.wwd-scripts-mysql]
run       = "sh scripts/wwd-mysql-setup_test.sh"
args      = "none"
class     = "release"
labels    = ["os:darwin"]
cacheable = false
timeout   = "10m"

[tasks.wwd-scripts-c2]
run       = "sh scripts/wwd-c2-matrix_test.sh"
args      = "none"
class     = "release"
labels    = ["os:darwin"]
cacheable = false
timeout   = "10m"

[tasks.wwd-scripts-c2-stub]
run       = "sh scripts/wwd-c2-matrix_stub_test.sh"
args      = "none"
class     = "release"
labels    = ["os:darwin"]
cacheable = false
timeout   = "10m"

[tasks.wwd-scripts-deploy]
run       = "sh scripts/wwd-deploy_test.sh"
args      = "none"
class     = "release"
labels    = ["os:darwin"]
cacheable = false
timeout   = "10m"

[tasks.wwd-scripts-gate]
run       = "sh scripts/release-gate_test.sh"
args      = "none"
class     = "release"
labels    = ["os:darwin"]
cacheable = false
timeout   = "10m"

[tasks.mod-all]
run       = "go test -json ./cmd/pdx/..."
args      = "none"
class     = "release"
labels     = ["os:darwin", "tool:go1.26"]
deps      = ["go.sum"]
cacheable = true
timeout   = "30m"
summary   = "go-json"
